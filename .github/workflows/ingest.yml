
name: Ingest

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Upload CSV to S3
        run: |
          aws s3 cp data/superstore.csv \
          s3://${{ secrets.AWS_RAW_BUCKET }}/data/superstore.csv

      - name: Inject S3 bucket name into SQL file
        run: |
          sed -i "s|{{AWS_RAW_BUCKET}}|${{ secrets.AWS_RAW_BUCKET }}|g" snowflake/load.sql
    
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2
        with:
          cli-version: "3.16"

      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: |
          snow connection add \
            --connection-name default \
            --account  $SNOWFLAKE_ACCOUNT \
            --username $SNOWFLAKE_USER \
            --password $SNOWFLAKE_PASSWORD \
            --rolename $SNOWFLAKE_ROLE \
            --no-interactive

      - name: Run Snowflake load
        run: |
          snow sql -f snowflake/load.sql

      - name: Run Snowflake transform
        run: |
          snow sql -f snowflake/transform.sql
    
      - name: Validate Snowflake data
        run: |
          snow sql -q '
          SELECT 
            COUNT(*) AS total_rows,
            COUNT(DISTINCT order_id) AS unique_orders
          FROM AURORA_DB.CURATED.curated_superstore;
          '
